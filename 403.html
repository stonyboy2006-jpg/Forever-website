<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Access Denied - You do not have permission to access this page.">
<title>Access Denied - Wedding Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0B0F19;color:#E8E0D0;font-family:'Poppins',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px}
.container{max-width:500px}
.code{font-family:'Playfair Display',serif;font-size:clamp(5rem,15vw,10rem);background:linear-gradient(135deg,#D4AF37,#B8860B,#D4AF37);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
h2{font-family:'Playfair Display',serif;font-size:1.6rem;color:#fff;margin:12px 0 8px}
p{color:#A09888;font-size:0.95rem;line-height:1.7;margin-bottom:24px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;background:linear-gradient(135deg,#D4AF37,#B8860B);color:#0B0F19;border-radius:50px;font-weight:600;text-decoration:none;font-size:0.85rem;transition:all 0.3s;border:none;cursor:pointer;font-family:'Poppins',sans-serif}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(212,175,55,0.3)}
.btn-outline{background:transparent;border:1px solid rgba(212,175,55,0.3);color:#D4AF37}
.btn-outline:hover{background:rgba(212,175,55,0.06)}
.buttons{margin-top:24px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.redirect-msg{color:rgba(255,255,255,0.25);font-size:0.78rem;margin-top:32px}
</style>
</head>
<body>
<div class="container">
  <div style="font-size:3rem;margin-bottom:12px">&#128274;</div>
  <div class="code">403</div>
  <h2>Access Denied</h2>
  <p>This page is only available to the wedding owner.</p>
  <div class="buttons" id="actionButtons">
    <a href="login.html" class="btn">Owner Login</a>
  </div>
  <p class="redirect-msg">If you are looking for a wedding invitation, please use the invitation link you received from the couple.</p>
</div>
<script>
(function(){
  var session = null;
  try {
    var s = JSON.parse(localStorage.getItem('weddingAuthSession'));
    if (s && s.expiresAt && Date.now() < s.expiresAt) session = s;
  } catch(e) {}
  if (session) {
    document.getElementById('actionButtons').innerHTML =
      '<a href="index.html" class="btn">Go to Dashboard</a>' +
      '<a href="login.html" class="btn btn-outline" onclick="localStorage.removeItem(\'weddingAuthSession\');return true">Logout</a>';
  }
})();
</script>
</body>
</html>
